name: Build and publish Nix cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.cache.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Build WFAS
        run: nix build --print-build-logs
      - id: cache
        uses: Ishaan-Datta/static-nix-cache/deploy@v1.2.0
        with:
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
